{% extends "base.html" %}
{% block title %}New Order – Warpspeed{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-plus-circle"></i> New Order</h1>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('orders.new') }}">
            <div class="mb-3">
                <label for="buyer_id" class="form-label">Buyer</label>
                <select class="form-select" name="buyer_id" id="buyer_id" required>
                    <option value="">Select buyer...</option>
                    {% for b in buyers %}
                    <option value="{{ b.id }}">{{ b.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="fabric_type" class="form-label">Fabric Type</label>
                <select class="form-select" name="fabric_type" id="fabric_type" required>
                    <option value="">Select fabric...</option>
                    {% for ft in fabric_types %}
                    <option value="{{ ft }}">{{ ft }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="colour" class="form-label">Colour</label>
                <input type="text" class="form-control" name="colour" id="colour"
                       value="Natural" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="meters" class="form-label">Meters</label>
                    <input type="number" step="1" min="1" class="form-control"
                           name="meters" id="meters" placeholder="e.g. 500" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="price_per_meter" class="form-label">Price per Meter (₹)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control"
                           name="price_per_meter" id="price_per_meter" placeholder="e.g. 250" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="deadline" class="form-label">Deadline</label>
                <input type="date" class="form-control" name="deadline" id="deadline" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-ws">
                    <i class="bi bi-check-lg"></i> Create Order
                </button>
                <a href="{{ url_for('orders.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
